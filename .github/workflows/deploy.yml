name: Deploy production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "要部署的完整 Git commit SHA（40 字元）"
        required: true
        type: string
  # merge 到 main → CI 建好映像並成功後，自動部署該 commit。
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  packages: read

concurrency:
  group: cloud-drive-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Ubuntu
    # 手動觸發一律執行；CI 自動觸發時，只在「push 到 main 且 CI 成功」才部署
    # （排除 PR 的 CI，以及失敗的 CI）。
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on:
      - self-hosted
      - linux
      - x64
      - production
    timeout-minutes: 20
    # GitHub 方案支援 Private Repository Environment 時可啟用人工核准
    # environment: production
    env:
      # 手動：用輸入的 SHA；自動：用觸發 CI 的 commit SHA。
      IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.image_tag || github.event.workflow_run.head_sha }}
    steps:
      - name: Validate image tag
        shell: bash
        run: |
          if [[ ! "${IMAGE_TAG}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "image_tag 必須是完整 40 字元 Git commit SHA。"
            exit 1
          fi
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy
        shell: bash
        run: |
          echo "觸發來源：${{ github.event_name }}，部署 SHA：${IMAGE_TAG}"
          sudo /usr/local/sbin/deploy-cloud-drive "${IMAGE_TAG}"
