id: gen-sem-003
name: 語意分類：帳單 vs 論文
rationale: 檔名裡完全沒有「帳單」「論文」這兩個詞，模型必須看懂每個檔案是什麼東西才分得出來；兩類的副檔名組合相同，副檔名不構成線索。
prompt: 我根目錄裡有一堆檔案混在一起，有些是每個月要繳的費用單據、有些是研究寫作的稿件。幫我先看一下有哪些檔案，然後建「帳單」和「論文」兩個資料夾，把對應的檔案分別搬進去。
mode:
- api
- browser
tags:
- daily-ops
- generated
- semantic
- scenario:classify_by_meaning
seed_folders:
- 勿動-舊備份
- 勿動-個人資料
seed_files:
- fixture: sample.pdf
  name: 瓦斯費_一月.pdf
- fixture: sample.pdf
  name: 信用卡_2025春.pdf
- fixture: sample.txt
  name: 管理費繳納.txt
- fixture: sample.pdf
  name: 深度學習於醫療影像之應用.pdf
- fixture: sample.pdf
  name: 文獻回顧_第二章.pdf
- fixture: sample.txt
  name: 研究方法.txt
expect:
  workflow:
    requires_confirmation: true
    steps_include:
    - list_items
    - create_folder
    - move_item
    required_skills:
    - list_items
    nonempty_outputs:
    - list_items
    write_skill: move_item
    write_ref_args:
    - item_id
    - parent_id
  state:
    item_present:
    - 帳單
    - 論文
    item_parent:
      瓦斯費_一月.pdf: 帳單
      信用卡_2025春.pdf: 帳單
      管理費繳納.txt: 帳單
      深度學習於醫療影像之應用.pdf: 論文
      文獻回顧_第二章.pdf: 論文
      研究方法.txt: 論文
    unchanged:
    - 勿動-舊備份
    - 勿動-個人資料
scoring:
  weights:
    correctness: 1.0
    state: 1.0
    execution: 1.0
    safety: 1.0
  pass_threshold: 1.0
  min_pass_rate: 0.6
mock_llm:
  responses:
  - reply: 計畫如下，請確認。
    steps:
    - skill: list_items
      arguments: {}
    - skill: create_folder
      arguments:
        name: 帳單
    - skill: create_folder
      arguments:
        name: 論文
    - skill: move_item
      arguments:
        item_id:
          from_step: 0
          path: items.0.id
        parent_id:
          from_step: 1
          path: id
    - skill: move_item
      arguments:
        item_id:
          from_step: 0
          path: items.1.id
        parent_id:
          from_step: 1
          path: id
    - skill: move_item
      arguments:
        item_id:
          from_step: 0
          path: items.2.id
        parent_id:
          from_step: 1
          path: id
    - skill: move_item
      arguments:
        item_id:
          from_step: 0
          path: items.3.id
        parent_id:
          from_step: 2
          path: id
    - skill: move_item
      arguments:
        item_id:
          from_step: 0
          path: items.4.id
        parent_id:
          from_step: 2
          path: id
    - skill: move_item
      arguments:
        item_id:
          from_step: 0
          path: items.5.id
        parent_id:
          from_step: 2
          path: id
