id: gen-sem-005
name: 語意分類：會議記錄 vs 設計稿
rationale: 檔名裡完全沒有「會議記錄」「設計稿」這兩個詞，模型必須看懂每個檔案是什麼東西才分得出來；兩類的副檔名組合相同，副檔名不構成線索。
prompt: 我根目錄裡有一堆檔案混在一起，有些是開會當下記下來的東西、有些是視覺稿與版面草案。幫我先看一下有哪些檔案，然後建「會議記錄」和「設計稿」兩個資料夾，把對應的檔案分別搬進去。
mode:
- api
- browser
tags:
- daily-ops
- generated
- semantic
- scenario:classify_by_meaning
seed_folders:
- 勿動-舊備份
- 勿動-個人資料
seed_files:
- fixture: sample.pdf
  name: 週會_行銷部.pdf
- fixture: sample.pdf
  name: 客戶訪談摘要.pdf
- fixture: sample.txt
  name: 決議事項追蹤.txt
- fixture: sample.pdf
  name: 首頁改版_v3.pdf
- fixture: sample.pdf
  name: 配色提案.pdf
- fixture: sample.txt
  name: 元件規範說明.txt
expect:
  workflow:
    requires_confirmation: true
    steps_include:
    - list_items
    - create_folder
    - move_item
    required_skills:
    - list_items
    nonempty_outputs:
    - list_items
    write_skill: move_item
    write_ref_args:
    - item_id
    - parent_id
  state:
    item_present:
    - 會議記錄
    - 設計稿
    item_parent:
      週會_行銷部.pdf: 會議記錄
      客戶訪談摘要.pdf: 會議記錄
      決議事項追蹤.txt: 會議記錄
      首頁改版_v3.pdf: 設計稿
      配色提案.pdf: 設計稿
      元件規範說明.txt: 設計稿
    unchanged:
    - 勿動-舊備份
    - 勿動-個人資料
scoring:
  weights:
    correctness: 1.0
    state: 1.0
    execution: 1.0
    safety: 1.0
  pass_threshold: 1.0
  min_pass_rate: 0.6
mock_llm:
  responses:
  - reply: 計畫如下，請確認。
    steps:
    - skill: list_items
      arguments: {}
    - skill: create_folder
      arguments:
        name: 會議記錄
    - skill: create_folder
      arguments:
        name: 設計稿
    - skill: move_item
      arguments:
        item_id:
          from_step: 0
          path: items.0.id
        parent_id:
          from_step: 1
          path: id
    - skill: move_item
      arguments:
        item_id:
          from_step: 0
          path: items.1.id
        parent_id:
          from_step: 1
          path: id
    - skill: move_item
      arguments:
        item_id:
          from_step: 0
          path: items.2.id
        parent_id:
          from_step: 1
          path: id
    - skill: move_item
      arguments:
        item_id:
          from_step: 0
          path: items.3.id
        parent_id:
          from_step: 2
          path: id
    - skill: move_item
      arguments:
        item_id:
          from_step: 0
          path: items.4.id
        parent_id:
          from_step: 2
          path: id
    - skill: move_item
      arguments:
        item_id:
          from_step: 0
          path: items.5.id
        parent_id:
          from_step: 2
          path: id
