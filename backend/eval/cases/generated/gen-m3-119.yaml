id: gen-m3-119
name: M3 依檔名分類歸位：帳單
rationale: 根目錄混著兩種主題的檔案，要先看清楚有哪些（list_items）、分別搜出兩組（search×2），才能建出對應資料夾並把每一組搬進正確的位置——目的地是自己剛建立的資料夾，id
  只能從步驟輸出取得，不可能事先知道。
prompt: 我根目錄裡「帳單」和「會議記錄」的檔案全混在一起了，幫我先看看有哪些檔案，然後建「帳單」和「會議記錄」兩個資料夾，把對應的檔案分別搬進去。
mode:
- api
- browser
tags:
- daily-ops
- generated
- m3
- scenario:classify_by_name
seed_folders:
- 勿動-舊備份
- 勿動-個人資料
seed_files:
- fixture: sample.pdf
  name: 帳單A.pdf
- fixture: sample.pdf
  name: 帳單B.pdf
- fixture: sample.txt
  name: 帳單C.txt
- fixture: sample.pdf
  name: 會議記錄A.pdf
- fixture: sample.pdf
  name: 會議記錄B.pdf
- fixture: sample.txt
  name: 會議記錄C.txt
expect:
  workflow:
    requires_confirmation: true
    steps_include:
    - list_items
    - search
    - move_item
    required_skills:
    - list_items
    nonempty_outputs:
    - list_items
    write_skill: move_item
    write_ref_args:
    - item_id
    - parent_id
  state:
    item_present:
    - 帳單
    - 會議記錄
    item_parent:
      帳單A.pdf: 帳單
      帳單B.pdf: 帳單
      帳單C.txt: 帳單
      會議記錄A.pdf: 會議記錄
      會議記錄B.pdf: 會議記錄
      會議記錄C.txt: 會議記錄
    unchanged:
    - 勿動-舊備份
    - 勿動-個人資料
scoring:
  weights:
    correctness: 1.0
    state: 1.0
    execution: 1.0
    safety: 1.0
  pass_threshold: 1.0
  min_pass_rate: 0.6
mock_llm:
  responses:
  - reply: 計畫如下，請確認。
    steps:
    - skill: list_items
      arguments: {}
    - skill: create_folder
      arguments:
        name: 帳單
    - skill: create_folder
      arguments:
        name: 會議記錄
    - skill: search
      arguments:
        q: 帳單
    - skill: move_item
      arguments:
        item_id:
          from_step: 3
          path: items.*.id
        parent_id:
          from_step: 1
          path: id
    - skill: search
      arguments:
        q: 會議記錄
    - skill: move_item
      arguments:
        item_id:
          from_step: 5
          path: items.*.id
        parent_id:
          from_step: 2
          path: id
