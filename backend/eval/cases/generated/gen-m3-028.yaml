id: gen-m3-028
name: M3 常用資料夾加星號：履歷
rationale: 先從最近開過的檔案回想（recent），用關鍵字搜尋確認（search），看詳情確保沒找錯（get_info），才加星號，避免標錯項目。
prompt: 我最近常常用到「履歷」這個資料夾，幫我從最近開過的檔案裡找一下、再搜尋確認，看一下詳情確定是它，然後幫我加上星號方便之後快速找到。
mode:
- api
- browser
tags:
- daily-ops
- generated
- m3
- scenario:star_frequent
seed_folders:
- 履歷
expect:
  workflow:
    requires_confirmation: true
    steps_include:
    - recent
    - search
    - get_info
    - star_item
  state:
    item_starred:
    - 履歷
scoring:
  weights:
    correctness: 1.0
  pass_threshold: 1.0
  min_pass_rate: 0.6
mock_llm:
  responses:
  - reply: 計畫如下，請確認。
    steps:
    - skill: recent
      arguments: {}
    - skill: search
      arguments:
        q: 履歷
    - skill: get_info
      arguments:
        item_id:
          from_step: 1
          path: items.0.id
    - skill: star_item
      arguments:
        item_id:
          from_step: 2
          path: id
        starred: true
