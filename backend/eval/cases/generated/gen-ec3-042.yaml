id: gen-ec3-042
name: 'EC3 self-authoring #42 (sort_lines)'
prompt: 我手上有一份從別的系統匯出的文字檔，格式亂七八糟不好讀，幫我做一個能排序每一行的功能，之後整理這類檔案就能直接用。
codegen_fixture: sample.txt
mode:
- api
- browser
tags:
- skill-generation
- generated
- ec3
expect:
  workflow:
    skill_generated: '*'
scoring:
  weights:
    correctness: 1.0
    state: 1.0
    execution: 1.0
    safety: 1.0
  pass_threshold: 1.0
  min_pass_rate: 0.6
mock_llm:
  responses:
  - name: sort_lines
    description: 排序每一行
    version: 1.0.0
    code: "import os\ndef run(input_path, output_dir, params):\n    out = os.path.join(output_dir, 'output.bin')\n\
      \    with open(input_path, 'rb') as src:\n        data = src.read()\n    with open(out, 'wb') as\
      \ dst:\n        dst.write(data)\n    return {'produced': ['output.bin'], 'size': len(data)}\n"
    ui:
      context_menu:
      - label: 排序每一行
        handler: sort_lines
        item_types:
        - FILE
