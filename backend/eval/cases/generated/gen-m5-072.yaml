id: gen-m5-072
name: M5 從近況回想再搜尋確認後改名：旅遊
rationale: 跟 rename_after_lookup 順序相反：先從最近開過的檔案回想（recent），再搜尋確認（search），再看容量（storage_quota），最後改名引用 search那一步（非最後一步、非第一步），考驗模型別固定引用某個位置。
prompt: 我記得最近有開過「旅遊」相關的檔案，幫我從最近開過的檔案裡找一下、再搜尋確認、順便看一下容量夠不夠，確認後把它改名成「旅遊_更新版」。
mode:
- api
- browser
tags:
- workflow-reuse
- generated
- m5
- scenario:rename_after_recent_first
seed_folders:
- 旅遊
- 勿動-舊備份
- 勿動-個人資料
expect:
  workflow:
    requires_confirmation: true
    steps_include:
    - recent
    - search
    - storage_quota
    - rename_item
    required_skills:
    - recent
    - search
    - storage_quota
    nonempty_outputs:
    - search
    write_skill: rename_item
    write_ref_args:
    - item_id
  state:
    item_present:
    - 旅遊_更新版
    item_absent_after:
    - 旅遊
    unchanged:
    - 勿動-舊備份
    - 勿動-個人資料
scoring:
  weights:
    correctness: 1.0
    state: 1.0
    execution: 1.0
    safety: 1.0
  pass_threshold: 1.0
  min_pass_rate: 0.6
mock_llm:
  responses:
  - reply: 多步驟計畫，請確認。
    steps:
    - skill: recent
      arguments: {}
    - skill: search
      arguments:
        q: 旅遊
    - skill: storage_quota
      arguments: {}
    - skill: rename_item
      arguments:
        item_id:
          from_step: 1
          path: items.0.id
        new_name: 旅遊_更新版
