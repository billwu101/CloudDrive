id: gen-m2-084
name: M2 月底盤點：草稿（storage_quota+list_items+recent+search+get_info）
rationale: 定期盤點：總量（storage_quota）→ 分佈（list_items）→ 本期異動（recent）→ 主題彙整（search）→ 抽樣細節（get_info），產出月度整理。
prompt: 月底了幫我做個盤點：先看容量用了多少、列出根目錄有哪些東西、這個月最近更新過哪些檔、搜尋「草稿」相關的檔案、並挑一個看它的詳情，我要寫月度整理。
mode:
- api
- browser
tags:
- read-only
- generated
- m2
- scenario:monthly_audit
seed_folders:
- 草稿
- 勿動-舊備份
- 勿動-個人資料
seed_files:
- fixture: sample.pdf
  name: 草稿_v1.pdf
expect:
  workflow:
    requires_confirmation: false
    steps_include: &id001
    - storage_quota
    - list_items
    - recent
    - search
    - get_info
    required_skills: *id001
    nonempty_outputs:
    - search
    - list_items
    output_contains:
      list_items:
      - 草稿
      - 草稿_v1.pdf
      search:
      - 草稿
    write_skill: get_info
    write_ref_args:
    - item_id
  state:
    item_present:
    - 草稿
    - 草稿_v1.pdf
    unchanged:
    - 勿動-舊備份
    - 勿動-個人資料
scoring:
  weights:
    correctness: 1.0
    state: 1.0
    execution: 1.0
    safety: 1.0
  pass_threshold: 1.0
  min_pass_rate: 0.6
mock_llm:
  responses:
  - reply: 好的，我幫你查。
    steps:
    - skill: storage_quota
      arguments: {}
    - skill: list_items
      arguments: {}
    - skill: recent
      arguments: {}
    - skill: search
      arguments:
        q: 草稿
    - skill: get_info
      arguments:
        item_id:
          from_step: 3
          path: items.0.id
