id: gen-m4-080
name: 'M4 self-authoring #80 (to_lf_endings)'
prompt: 我在整理雲端硬碟，想先摸清楚每個檔案的狀況再決定怎麼分類，幫我做一個能把換行統一成 LF的功能。
mode:
- api
- browser
tags:
