id: gen-m3-056
name: M3 結束的專案搬進封存資料夾：設計稿
rationale: 搬移前要先確定專案資料夾的位置（search）、了解根目錄現況以免搬錯（list_items）、確認詳情（get_info），再搬進真的存在的封存資料夾——封存資料夾也是真的搜尋找到
  id，不是寫死路徑。
prompt: 「設計稿」這個專案已經結束了，幫我搜尋一下確認位置、看看根目錄現在的結構、查一下它的詳情，確認後把它搬到我的「設計稿封存」資料夾裡。
mode:
- api
- browser
tags:
- daily-ops
- generated
- m3
- scenario:archive_project
seed_folders:
- 設計稿
- 設計稿封存
seed_files: []
expect:
  workflow:
    requires_confirmation: true
    steps_include:
    - search
    - list_items
    - get_info
    - move_item
    write_skill: move_item
    write_ref_args:
    - item_id
    - parent_id
  state:
    item_parent:
      設計稿: 設計稿封存
scoring:
  weights:
    correctness: 1.0
  pass_threshold: 1.0
  min_pass_rate: 0.6
mock_llm:
  responses:
  - reply: 計畫如下，請確認。
    steps:
    - skill: search
      arguments:
        q: 設計稿
    - skill: list_items
      arguments: {}
    - skill: get_info
      arguments:
        item_id:
          from_step: 0
          path: items.0.id
    - skill: search
      arguments:
        q: 設計稿封存
    - skill: move_item
      arguments:
        item_id:
          from_step: 2
          path: id
        parent_id:
          from_step: 3
          path: items.0.id
