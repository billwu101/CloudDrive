id: gen-m5-084
name: M5 查詳情與容量後才加星號：草稿
rationale: 搜尋找到候選（search）、查看詳情確認（get_info）、順便看一下容量（storage_quota），最後加星號引用 get_info 那一步的結果。
prompt: 幫我搜尋一下「草稿」，查看一下詳情確認是不是我要的那個，順便看一下容量用量，確認後幫我加上星號。
mode:
- api
- browser
tags:
- workflow-reuse
- generated
- m5
- scenario:star_after_full_review
seed_folders:
- 草稿
expect:
  workflow:
    requires_confirmation: true
    steps_include:
    - search
    - get_info
    - storage_quota
    - star_item
    write_skill: star_item
    write_ref_args:
    - item_id
  state:
    item_starred:
    - 草稿
scoring:
  weights:
    correctness: 1.0
  pass_threshold: 1.0
  min_pass_rate: 0.6
mock_llm:
  responses:
  - reply: 多步驟計畫，請確認。
    steps:
    - skill: search
      arguments:
        q: 草稿
    - skill: get_info
      arguments:
        item_id:
          from_step: 0
          path: items.0.id
    - skill: storage_quota
      arguments: {}
    - skill: star_item
      arguments:
        item_id:
          from_step: 1
          path: id
        starred: true
