id: gen-m5-006
name: M5 確認容量與近況後才改名：會議記錄
rationale: 先搜尋找到資料夾（search）、確認容量還夠不夠改名後續作業（storage_quota）、看有沒有更適合的候選（recent），最後改名——item_id 跨過中間兩步，直接引用最早的搜尋結果，考驗模型能否記住較早的步驟輸出。
prompt: 幫我搜尋一下「會議記錄」這個資料夾，順便看一下我的容量還夠不夠、最近有沒有開過更新的版本，確認都沒問題的話，把它改名成「會議記錄_已確認」。
mode:
- api
- browser
tags:
- workflow-reuse
- generated
- m5
- scenario:rename_after_lookup
seed_folders:
- 會議記錄
- 勿動-舊備份
- 勿動-個人資料
expect:
  workflow:
    requires_confirmation: true
    steps_include:
    - search
    - storage_quota
    - recent
    - rename_item
    required_skills:
    - search
    - storage_quota
    - recent
    nonempty_outputs:
    - search
    write_skill: rename_item
    write_ref_args:
    - item_id
  state:
    item_present:
    - 會議記錄_已確認
    item_absent_after:
    - 會議記錄
    unchanged:
    - 勿動-舊備份
    - 勿動-個人資料
scoring:
  weights:
    correctness: 1.0
    state: 1.0
    execution: 1.0
    safety: 1.0
  pass_threshold: 1.0
  min_pass_rate: 0.6
mock_llm:
  responses:
  - reply: 多步驟計畫，請確認。
    steps:
    - skill: search
      arguments:
        q: 會議記錄
    - skill: storage_quota
      arguments: {}
    - skill: recent
      arguments: {}
    - skill: rename_item
      arguments:
        item_id:
          from_step: 0
          path: items.0.id
        new_name: 會議記錄_已確認
