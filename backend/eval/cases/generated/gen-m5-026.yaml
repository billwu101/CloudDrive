id: gen-m5-026
name: M5 瀏覽清單與近況後才加星號：會議記錄
rationale: 從最近開過的檔案回想（recent）、瀏覽根目錄清單找到它（list_items）、再搜尋確認關鍵字命中（search），最後加星號——item_id 引用的是list_items
  那一步，而不是緊接在寫入之前的 search，考驗模型別誤引到最後一次查詢。
prompt: 我最近常常翻我的最近開啟清單找「會議記錄」，幫我先看一下最近開過的檔案、列出根目錄看看它在不在、再搜尋確認一下，找到後幫我加上星號。
mode:
- api
- browser
tags:
- workflow-reuse
- generated
- m5
- scenario:star_after_browse
seed_folders:
- 會議記錄
expect:
  workflow:
    requires_confirmation: true
    steps_include:
    - recent
    - list_items
    - search
    - star_item
  state:
    item_starred:
    - 會議記錄
scoring:
  weights:
    correctness: 1.0
  pass_threshold: 1.0
  min_pass_rate: 0.6
mock_llm:
  responses:
  - reply: 多步驟計畫，請確認。
    steps:
    - skill: recent
      arguments: {}
    - skill: list_items
      arguments: {}
    - skill: search
      arguments:
        q: 會議記錄
    - skill: star_item
      arguments:
        item_id:
          from_step: 1
          path: items.0.id
        starred: true
