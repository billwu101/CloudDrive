id: gen-m3-001
name: M3 佔位資料夾轉正式命名：報告
rationale: 佔位資料夾要轉正式命名前，得先確認是不是同一個（search→get_info），也要排除有更新版本的可能（recent），才不會改錯。
prompt: 我之前先隨便建了一個叫「報告」的資料夾佔位，內容現在確定了。幫我搜尋一下找到它、看一下詳情確認是不是我要的那個，也順便看我最近開過的檔案裡有沒有更新版本，確認後把它改名成「報告_正式版」。
mode:
- api
- browser
tags:
- daily-ops
- generated
- m3
- scenario:rename_placeholder
seed_folders:
- 報告
expect:
  workflow:
    requires_confirmation: true
    steps_include:
    - search
    - get_info
    - recent
    - rename_item
scoring:
  weights:
    correctness: 1.0
  pass_threshold: 1.0
  min_pass_rate: 0.6
mock_llm:
  responses:
  - reply: 計畫如下，請確認。
    steps:
    - skill: search
      arguments:
        q: 報告
    - skill: get_info
      arguments:
        item_id:
          from_step: 0
          path: items.0.id
    - skill: recent
      arguments: {}
    - skill: rename_item
      arguments:
        item_id:
          from_step: 1
          path: id
        new_name: 報告_正式版
