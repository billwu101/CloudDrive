id: gen-m3-074
name: M3 開新專案先確認容量與命名：備份
rationale: 開新專案前先確認容量夠不夠（storage_quota）、看根目錄現有分類方式（list_items）、確認沒有同名舊資料夾（search），再建立新資料夾——建新資料夾不指涉既有項目，沒有模糊指代問題。
prompt: 我要開始一個新的「備份」專案，先幫我看一下容量還夠不夠、列出根目錄現有哪些資料夾、搜尋一下有沒有同名的舊資料，確認都沒問題後幫我建一個新資料夾。
mode:
- api
- browser
tags:
- daily-ops
- generated
- m3
- scenario:new_project
seed_folders: []
seed_files: []
expect:
  workflow:
    requires_confirmation: true
    steps_include:
    - storage_quota
    - list_items
    - search
    - create_folder
  state:
    item_present:
    - 備份
scoring:
  weights:
    correctness: 1.0
  pass_threshold: 1.0
  min_pass_rate: 0.6
mock_llm:
  responses:
  - reply: 計畫如下，請確認。
    steps:
    - skill: storage_quota
      arguments: {}
    - skill: list_items
      arguments: {}
