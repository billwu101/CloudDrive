# 正式環境 compose（部署主機 /opt/cloud-drive/compose.prod.yml）。
# 由 deploy-cloud-drive 腳本以 IMAGE_TAG（commit SHA）拉取並啟動。
# 與本機開發的 docker-compose.yml 不同：使用 GHCR 預建 image，不在主機 build。
name: cloud-drive

services:
  postgres:
    image: pgvector/pgvector:pg16        # 與本專案一致：語意搜尋需要 pgvector（非 postgres:16-alpine）
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/billwu101/cloud-drive-backend:${IMAGE_TAG}
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - storage_data:/app/storage        # 對應 LOCAL_STORAGE_PATH
    ports:
      - "127.0.0.1:8001:8000"            # 只綁 loopback；對外由 frontend/nginx 反代

  frontend:
    image: ghcr.io/billwu101/cloud-drive-frontend:${IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8088:80"                        # 正式可改 80/443；接 Cloudflare Tunnel 後可移除對外映射

  # 對外曝露：Cloudflare Tunnel（僅正式環境；dev 的 docker-compose.yml 無此服務）
  # cloudflared 主動向外連 Cloudflare，不需對主機開任何 port、不受動態 IP 影響。
  # 用 remote-managed tunnel（token 模式）：TUNNEL_TOKEN 由 Cloudflare Zero-Trust 建 tunnel 時產生，
  # ingress 路由（<網域> → frontend:80）在 Cloudflare 儀表板設定。詳見 detailed-design §21.9。
  cloudflared:
    image: cloudflare/cloudflared:latest  # 正式上線可釘特定版本 tag
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    env_file:
      - .env                              # 提供 TUNNEL_TOKEN
    depends_on:
      - frontend

volumes:
  postgres_data:
  storage_data:
